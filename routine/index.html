<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 궤도 · 루틴</title>
<meta name="theme-color" content="#e9edf1">
<style>
@font-face{font-family:"Gowun Batang";font-weight:400;font-display:swap;src:url(fonts/gowun-batang-korean-400-normal.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Gowun Batang";font-weight:400;font-display:swap;src:url(fonts/gowun-batang-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Gowun Batang";font-weight:700;font-display:swap;src:url(fonts/gowun-batang-korean-700-normal.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Gowun Batang";font-weight:700;font-display:swap;src:url(fonts/gowun-batang-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Noto Sans KR";font-weight:300;font-display:swap;src:url(fonts/noto-sans-kr-korean-300-normal.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Noto Sans KR";font-weight:300;font-display:swap;src:url(fonts/noto-sans-kr-latin-300-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Noto Sans KR";font-weight:400;font-display:swap;src:url(fonts/noto-sans-kr-korean-400-normal.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Noto Sans KR";font-weight:400;font-display:swap;src:url(fonts/noto-sans-kr-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Noto Sans KR";font-weight:500;font-display:swap;src:url(fonts/noto-sans-kr-korean-500-normal.woff2) format("woff2");unicode-range:U+AC00-D7A3,U+1100-11FF,U+3130-318F}
@font-face{font-family:"Noto Sans KR";font-weight:500;font-display:swap;src:url(fonts/noto-sans-kr-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}

/* Theme: 새벽 궤도 (custom, theme-picker format) */
:root{
  --mist:#e9edf1;      /* 바탕 */
  --paper:#f6f8fa;     /* 표면 */
  --ink:#1e2d5a;       /* 본문, 선 */
  --lake:#3f7f86;      /* 보조 */
  --sun:#f0a202;       /* 완료, 지금 */
  --muted:#5b6780;     /* 보조 텍스트 (4.5:1 on mist) */
  --line:#c5ccd8;
  --serif:"Gowun Batang",serif;
  --sans:"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--mist);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lake);outline-offset:3px;border-radius:4px}

.app{max-width:1120px;margin:0 auto;padding:40px 28px 80px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:1fr;gap:28px;padding:24px 18px 64px}}

/* ---------- dial side ---------- */
.orbit{position:sticky;top:24px}
@media (max-width:860px){.orbit{position:static}}
.date{font-family:var(--serif);font-size:2.25rem;line-height:1.2;margin:0 0 4px;font-weight:400;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-weight:300}
#dial{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
#dial .mk{cursor:pointer}
#dial .mk:focus-visible{outline:none}
#dial .mk:focus-visible circle{stroke:var(--lake);stroke-width:3}
.week{display:flex;justify-content:space-between;max-width:420px;margin:18px auto 0;padding:0}
.week li{list-style:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;color:var(--muted)}
.week li.today{color:var(--ink);font-weight:500}
.week svg{width:30px;height:30px}

/* ---------- list side ---------- */
.panel h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.alarm-state{display:flex;align-items:center;gap:8px;font-size:.875rem;color:var(--muted)}
.btn-text{background:none;border:0;padding:6px 2px;color:var(--lake);font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-text:hover{color:var(--ink)}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:56px 1fr auto auto;align-items:center;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item time{font-variant-numeric:tabular-nums;font-weight:500;font-size:.95rem;color:var(--muted)}
.item.now time{color:var(--ink)}
.item .title{font-size:1.05rem}
.item .meta{display:block;font-size:.8rem;color:var(--muted);font-weight:300}
.item.done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sun);text-decoration-thickness:2px}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:background .18s,border-color .18s}
.check svg{opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s}
.item.done .check{background:var(--sun);border-color:var(--sun)}
.item.done .check svg{opacity:1;transform:none}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--paper);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--ink)}
.icon-btn[aria-pressed="false"] .on{display:none}
.icon-btn[aria-pressed="true"] .off{display:none}
.del{display:none}
.editing .del{display:grid}
.editing .bell{display:none}
.empty{padding:36px 0;text-align:center;color:var(--muted)}
.empty img{width:160px;display:block;margin:0 auto 12px;opacity:.9}

/* add form */
.add{margin-top:28px;background:var(--paper);border-radius:14px;padding:20px}
.add h3{margin:0 0 14px;font-size:1rem;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.field input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;font-size:1rem;color:var(--ink);min-width:0}
.field.grow{flex:1 1 200px}
.days{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.day{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:.875rem}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.add-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 22px;font-weight:500;cursor:pointer}
.btn:hover{background:#2a3c74}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--paper)}
.hint{font-size:.8rem;color:var(--muted);margin:16px 0 0;font-weight:300;max-width:46ch}

/* alarm dialog */
dialog{border:0;border-radius:18px;padding:0;max-width:380px;width:calc(100% - 32px);background:var(--paper);color:var(--ink);box-shadow:0 24px 60px rgba(30,45,90,.28)}
dialog::backdrop{background:rgba(30,45,90,.45)}
.alarm-art{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;object-position:50% 34%;border-radius:18px 18px 0 0;background:var(--mist)}
.alarm-body{padding:20px 24px 24px}
.alarm-body time{font-size:2.6rem;font-weight:300;font-variant-numeric:tabular-nums;line-height:1}
.alarm-body h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:8px 0 20px}
.alarm-actions{display:flex;gap:10px}
.alarm-actions .btn{flex:1}
dialog[open]{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <section class="orbit" aria-label="오늘의 진행">
    <h1 class="date" id="date"></h1>
    <p class="sub" id="summary"></p>
    <svg id="dial" viewBox="0 0 520 520" role="img" aria-labelledby="dialTitle"><title id="dialTitle">하루 24시간 위에 놓인 루틴</title></svg>
    <ul class="week" id="week" aria-label="최근 7일 완료율"></ul>
  </section>

  <section class="panel" aria-labelledby="listTitle">
    <div class="panel-head">
      <h2 id="listTitle">오늘 할 일</h2>
      <button class="btn-text" id="editBtn" aria-pressed="false">편집</button>
    </div>
    <div class="alarm-state"><span id="alarmStatus"></span><button class="btn-text" id="notifyBtn" hidden>알림 허용하기</button></div>
    <ul class="list" id="list"></ul>

    <form class="add" id="addForm" autocomplete="off">
      <h3>루틴 추가</h3>
      <div class="row">
        <label class="field grow">할 일<input id="fTitle" required maxlength="40" placeholder="예: 물 한 잔 마시기"></label>
        <label class="field">시간<input id="fTime" type="time" required value="07:00"></label>
      </div>
      <div class="days" id="fDays" role="group" aria-label="반복 요일"></div>
      <div class="add-foot">
        <label class="toggle"><input type="checkbox" id="fAlarm" checked> 이 시간에 알람 울리기</label>
        <button class="btn" type="submit">루틴 추가</button>
      </div>
    </form>
    <p class="hint">알람은 이 페이지가 열려 있는 동안 울려요. 휴대폰에서는 홈 화면에 추가하고 탭을 열어 두세요. <button class="btn-text" id="testBtn" type="button">알람 소리 들어보기</button></p>
  </section>
</main>

<dialog id="alarm" aria-labelledby="alarmTitle">
  <img class="alarm-art" src="art/orbital-stillness.png" alt="">
  <div class="alarm-body">
    <time id="alarmTime"></time>
    <h3 id="alarmTitle"></h3>
    <div class="alarm-actions">
      <button class="btn ghost" id="snoozeBtn">5분 뒤 다시</button>
      <button class="btn" id="doneBtn">완료</button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const DAY = ['일','월','화','수','목','금','토'];
const KEY = 'orbit-routine-v1';
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };

const seed = () => ({
  routines: [
    ['06:30','물 한 잔 마시기'],['07:00','스트레칭 10분'],['09:00','오늘 가장 중요한 일 시작'],
    ['12:30','점심 후 산책'],['18:30','운동'],['21:30','책 20쪽 읽기'],['23:00','휴대폰 내려놓고 취침 준비']
  ].map(([time,title],i)=>({id:'r'+i+Date.now(),time,title,days:[0,1,2,3,4,5,6],alarm:true})),
  log:{}, fired:{}, snooze:[]
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { S = seed(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

const todays = (d=new Date()) => S.routines.filter(r=>r.days.includes(d.getDay())).sort((a,b)=>toMin(a.time)-toMin(b.time));
const doneSet = (d=new Date()) => new Set(S.log[dkey(d)]||[]);
function setDone(id, on){
  const k = dkey(new Date()); const s = new Set(S.log[k]||[]);
  on ? s.add(id) : s.delete(id); S.log[k] = [...s];
  S.snooze = S.snooze.filter(x=>x.id!==id || !on);
  save(); render();
}
const daysLabel = days => days.length===7 ? '매일' : (days.join()==='1,2,3,4,5' ? '평일' : (days.join()==='0,6' ? '주말' : days.map(i=>DAY[i]).join(' ')));

/* ---------- dial ---------- */
const NS='http://www.w3.org/2000/svg', C=260;
const el = (n,a={},p) => { const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); p&&p.appendChild(e); return e; };
const polar = (r,min) => { const a=(min/1440)*2*Math.PI-Math.PI/2; return [C+r*Math.cos(a), C+r*Math.sin(a)]; };
function arc(r,m0,m1){ const [x0,y0]=polar(r,m0),[x1,y1]=polar(r,m1); return `M${x0} ${y0}A${r} ${r} 0 ${(m1-m0)>720?1:0} 1 ${x1} ${y1}`; }

function drawDial(){
  const svg=$('#dial'); [...svg.querySelectorAll(':not(title)')].forEach(n=>n.remove());
  const now=new Date(), nm=now.getHours()*60+now.getMinutes();
  const list=todays(), done=doneSet();
  [44,70,104,148,196,232].forEach((r,i)=>el('circle',{cx:C,cy:C,r,fill:'none',stroke:i===3||i===5?'#1e2d5a':'#9aa4b5','stroke-width':i===3||i===5?1.2:.8},svg));
  for(let k=0;k<96;k++){ const big=k%24===0, hr=k%4===0, L=big?16:hr?9:4;
    const [x0,y0]=polar(240,k*15),[x1,y1]=polar(240+L,k*15);
    el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:hr?'#1e2d5a':'#9aa4b5','stroke-width':big?2:hr?1.2:.7},svg); }
  [[0,'00'],[360,'06'],[720,'12'],[1080,'18']].forEach(([m,t])=>{ const [x,y]=polar(250+20,m);
    const tx=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':12,fill:'#5b6780','font-family':'Noto Sans KR','font-weight':300},svg); tx.textContent=t; });
  for(let h=0;h<24;h++){ const [x,y]=polar(104,h*60); el('circle',{cx:x,cy:y,r:h%6?1.6:2.8,fill:h%6?'#9aa4b5':'#1e2d5a'},svg); }
  // elapsed arc from first routine (or 06:00) to now
  const start = list.length ? Math.min(toMin(list[0].time), nm) : Math.min(360, nm);
  if(nm>start) el('path',{d:arc(196,start,nm),fill:'none',stroke:'#f0a202','stroke-width':6,'stroke-linecap':'round'},svg);
  // markers
  list.forEach(r=>{ const m=toMin(r.time), isDone=done.has(r.id);
    const [sx,sy]=polar(150,m),[ex,ey]=polar(138,m),[x,y]=polar(148,m);
    const g=el('g',{class:'mk',tabindex:0,role:'button','aria-label':`${r.time} ${r.title} ${isDone?'완료됨':'미완료'}`},svg);
    const [ix,iy]=polar(104,m); el('line',{x1:ix,y1:iy,x2:ex,y2:ey,stroke:'#9aa4b5','stroke-width':.6},g);
    el('circle',{cx:x,cy:y,r:9,fill:isDone?'#f0a202':'#e9edf1',stroke:isDone?'#f0a202':'#1e2d5a','stroke-width':1.8},g);
    const tt=el('title',{},g); tt.textContent=`${r.time} ${r.title}`;
    const toggle=()=>setDone(r.id,!isDone);
    g.addEventListener('click',toggle); g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  });
  // hand
  const [hx,hy]=polar(232,nm);
  el('line',{x1:C,y1:C,x2:hx,y2:hy,stroke:'#1e2d5a','stroke-width':1.4},svg);
  el('circle',{cx:hx,cy:hy,r:5.5,fill:'#f0a202'},svg);
  el('circle',{cx:C,cy:C,r:3.5,fill:'#1e2d5a'},svg);
  // centre count
  const n=list.filter(r=>done.has(r.id)).length;
  const t1=el('text',{x:C,y:C-6,'text-anchor':'middle','font-size':26,'font-family':'Gowun Batang',fill:'#1e2d5a'},svg); t1.textContent=`${n}/${list.length}`;
  const t2=el('text',{x:C,y:C+16,'text-anchor':'middle','font-size':11,'font-family':'Noto Sans KR',fill:'#5b6780'},svg); t2.textContent='완료';
}

function drawWeek(){
  const ul=$('#week'); ul.innerHTML='';
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
    const list=todays(d), done=doneSet(d), n=list.filter(r=>done.has(r.id)).length;
    const ratio=list.length? n/list.length : 0;
    const li=document.createElement('li'); if(i===0) li.className='today';
    const r=12, c=2*Math.PI*r;
    li.innerHTML=`<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="${r}" fill="none" stroke="#c5ccd8" stroke-width="2.5"/><circle cx="15" cy="15" r="${r}" fill="none" stroke="#f0a202" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${c*ratio} ${c}" transform="rotate(-90 15 15)"/></svg>${DAY[d.getDay()]}<span class="sr">요일 ${Math.round(ratio*100)}% 완료</span>`;
    ul.appendChild(li);
  }
}

/* ---------- list ---------- */
const ICON = {
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  bell:'<svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/></svg><svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/><path d="M4 4l16 16"/></svg>',
  del:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>'
};
function drawList(){
  const ul=$('#list'), list=todays(), done=doneSet();
  const nm=new Date().getHours()*60+new Date().getMinutes();
  const nextIdx=list.findIndex(r=>!done.has(r.id) && toMin(r.time)>=nm-30);
  ul.innerHTML='';
  if(!list.length){ ul.innerHTML='<li class="empty"><img src="art/orbital-stillness.png" alt="">오늘 요일에 잡힌 루틴이 없어요. 아래에서 첫 루틴을 추가하세요.</li>'; return; }
  list.forEach((r,i)=>{
    const li=document.createElement('li');
    li.className='item'+(done.has(r.id)?' done':'')+(i===nextIdx?' now':'');
    li.innerHTML=`<time>${r.time}</time>
      <div><span class="title"></span><span class="meta">${daysLabel(r.days)}${r.alarm?'':' / 알람 꺼짐'}</span></div>
      <button class="icon-btn bell" aria-pressed="${r.alarm}" aria-label="알람 ${r.alarm?'끄기':'켜기'}">${ICON.bell}</button>
      <button class="icon-btn del" aria-label="${r.title} 삭제">${ICON.del}</button>
      <button class="check" aria-pressed="${done.has(r.id)}" aria-label="${r.title} 완료 표시">${ICON.check}</button>`;
    li.querySelector('.title').textContent=r.title;
    li.querySelector('.check').onclick=()=>{ const on=!done.has(r.id); setDone(r.id,on); if(on) toast(`'${r.title}' 완료`); };
    li.querySelector('.bell').onclick=()=>{ r.alarm=!r.alarm; save(); render(); toast(r.alarm?'알람을 켰어요':'알람을 껐어요'); };
    li.querySelector('.del').onclick=()=>{ S.routines=S.routines.filter(x=>x.id!==r.id); save(); render(); toast(`'${r.title}' 삭제됨`); };
    // put delete before check visually only in edit mode
    if(i===nextIdx) li.setAttribute('aria-current','true');
    ul.appendChild(li);
  });
}

function drawHeader(){
  const d=new Date(), list=todays(), done=doneSet();
  $('#date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${DAY[d.getDay()]}요일`;
  const left=list.filter(r=>!done.has(r.id));
  const nm=d.getHours()*60+d.getMinutes();
  const next=left.find(r=>toMin(r.time)>=nm);
  $('#summary').textContent = !list.length ? '오늘은 비어 있는 궤도예요.'
    : !left.length ? '오늘 루틴을 모두 마쳤어요.'
    : next ? `다음은 ${next.time} ${next.title}` : `${left.length}개가 아직 남아 있어요.`;
}
function drawAlarmState(){
  const p = ('Notification' in window) ? Notification.permission : 'unsupported';
  $('#alarmStatus').textContent = p==='granted' ? '알람 켜짐: 소리와 알림으로 알려드려요.' : p==='denied' ? '알림이 차단돼 있어요. 소리와 화면 알람만 울려요.' : p==='unsupported' ? '이 브라우저는 알림을 지원하지 않아 소리와 화면 알람만 울려요.' : '알림을 허용하면 다른 탭에 있어도 알려드려요.';
  $('#notifyBtn').hidden = p!=='default';
}
function render(){ drawHeader(); drawDial(); drawWeek(); drawList(); drawAlarmState(); }

/* ---------- add form ---------- */
const fDays=new Set([0,1,2,3,4,5,6]);
[1,2,3,4,5,6,0].forEach(i=>{ const b=document.createElement('button'); b.type='button'; b.className='day'; b.textContent=DAY[i];
  b.setAttribute('aria-pressed','true'); b.onclick=()=>{ fDays.has(i)?fDays.delete(i):fDays.add(i); b.setAttribute('aria-pressed',fDays.has(i)); };
  $('#fDays').appendChild(b); });
$('#addForm').onsubmit=e=>{ e.preventDefault();
  if(!fDays.size){ toast('반복할 요일을 하나 이상 고르세요'); return; }
  const title=$('#fTitle').value.trim(); if(!title) return;
  S.routines.push({id:'r'+Date.now(),title,time:$('#fTime').value,days:[...fDays].sort(),alarm:$('#fAlarm').checked});
  save(); render(); $('#fTitle').value=''; toast(`'${title}' 추가됨`);
  if($('#fAlarm').checked) askNotify();
};
$('#editBtn').onclick=e=>{ const on=document.body.classList.toggle('editing'); e.target.setAttribute('aria-pressed',on); e.target.textContent=on?'편집 끝내기':'편집'; };

/* ---------- alarm ---------- */
let ctx, ringTimer, current=null;
const unlock=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch{} } ctx&&ctx.state==='suspended'&&ctx.resume(); };
addEventListener('pointerdown',unlock); addEventListener('keydown',unlock);
function chime(){ if(!ctx) return; const t=ctx.currentTime;
  [[880,0],[1174.7,.18],[1568,.36]].forEach(([f,o])=>{ const os=ctx.createOscillator(), g=ctx.createGain();
    os.type='sine'; os.frequency.value=f; g.gain.setValueAtTime(0,t+o); g.gain.linearRampToValueAtTime(.32,t+o+.02); g.gain.exponentialRampToValueAtTime(.0001,t+o+1.1);
    os.connect(g).connect(ctx.destination); os.start(t+o); os.stop(t+o+1.2); }); }
function askNotify(){ if('Notification' in window && Notification.permission==='default') Notification.requestPermission().then(drawAlarmState); }
$('#notifyBtn').onclick=askNotify;
$('#testBtn').onclick=()=>{ unlock(); chime(); };

function ring(r){
  if(current) return; current=r;
  $('#alarmTime').textContent=r.time; $('#alarmTitle').textContent=r.title;
  const dlg=$('#alarm'); if(!dlg.open) dlg.showModal();
  chime(); let n=0; ringTimer=setInterval(()=>{ if(++n>20) return stopRing(); chime(); },3000);
  if('vibrate' in navigator) navigator.vibrate([300,150,300]);
  if('Notification' in window && Notification.permission==='granted'){
    try{ const no=new Notification(`${r.time} ${r.title}`,{body:'루틴 시간이에요.',tag:r.id,requireInteraction:true}); no.onclick=()=>{focus(); no.close();}; }catch{}
  }
  document.title=`⏰ ${r.title}`;
}
function stopRing(){ clearInterval(ringTimer); current=null; document.title='오늘의 궤도 · 루틴'; const d=$('#alarm'); d.open&&d.close(); }
$('#doneBtn').onclick=()=>{ const r=current; stopRing(); if(r){ setDone(r.id,true); toast(`'${r.title}' 완료`); } };
$('#snoozeBtn').onclick=()=>{ const r=current; stopRing(); if(r){ S.snooze.push({id:r.id,at:Date.now()+5*60e3}); save(); toast('5분 뒤에 다시 알려드려요'); } };
$('#alarm').addEventListener('cancel',e=>{ e.preventDefault(); $('#snoozeBtn').click(); });

let lastDay=dkey(new Date());
function tick(){
  const now=new Date(), k=dkey(now), nm=now.getHours()*60+now.getMinutes();
  if(k!==lastDay){ lastDay=k; S.fired={}; save(); }
  const done=doneSet();
  if(!current){
    // snoozed first
    const due=S.snooze.find(s=>s.at<=Date.now());
    if(due){ S.snooze=S.snooze.filter(s=>s!==due); save(); const r=S.routines.find(x=>x.id===due.id); if(r && !done.has(r.id)) { ring(r); } }
    else for(const r of todays(now)){
      const m=toMin(r.time);
      // fire at the minute, or catch up within 2 min if the tab was asleep
      if(r.alarm && !done.has(r.id) && !S.fired[k+r.id] && nm>=m && nm-m<=2){ S.fired[k+r.id]=1; save(); ring(r); break; }
    }
  }
  render();
}
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

render(); setInterval(tick,10000); setTimeout(tick,500);
</script>
</body>
